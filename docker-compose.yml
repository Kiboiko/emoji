services:
  postgres:
    image: postgres:17-alpine
    container_name: marketplace_db
    environment:
      POSTGRES_DB: ${DB_NAME:-marketplace}
      POSTGRES_USER: ${DB_USER:-marketplace_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-marketplace_user} -d ${DB_NAME:-marketplace}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - marketplace-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketplace_backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    networks:
      - marketplace-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_BOT_USERNAME=${VITE_BOT_USERNAME:-Marketplace1337bot}
    container_name: marketplace_frontend
    volumes:
      - frontend-dist:/app/dist
    restart: unless-stopped
    networks:
      - marketplace-network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: marketplace_admin
    volumes:
      - admin-dist:/app/dist
    restart: unless-stopped
    networks:
      - marketplace-network

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: marketplace_bot
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - marketplace-network

  nginx:
    image: nginx:1.27-alpine
    container_name: marketplace_nginx
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend-dist:/usr/share/nginx/html/frontend:ro
      - admin-dist:/usr/share/nginx/html/admin:ro
      - uploads:/usr/share/nginx/html/uploads:ro

    ports:
      - "${HTTP_PORT:-8080}:80"

    restart: unless-stopped
    networks:
      - marketplace-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  uploads:
  frontend-dist:
  admin-dist:


networks:
  marketplace-network:
    driver: bridge
