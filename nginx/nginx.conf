events {
    worker_connections 2048;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # Security headers
    # Allow Telegram Web to load the app in iframe (required for Mini Apps)
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    # Фото до 20 МБ (MAX_UPLOAD_SIZE в backend/config.py) плюс запас на
    # остальные поля формы
    client_max_body_size 25M;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;
    
    # DNS Docker. Без него nginx резолвит имена апстримов ОДИН раз при старте
    # и держит IP вечно: после `docker compose up -d --force-recreate backend`
    # контейнер получает новый IP, а nginx продолжает стучаться в старый и
    # отдаёт 502, пока его не перезапустят вручную.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name localhost;

        # Frontend
        location / {
            root /usr/share/nginx/html/frontend;
            index index.html;
            try_files $uri $uri/ /index.html;
            
            # Disable cache for JS/CSS
            location ~* \.(js|css)$ {
                add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
                add_header Pragma "no-cache";
                add_header Expires "0";
            }
            
            # Cache images/fonts only
            location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Admin Panel
        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            alias /usr/share/nginx/html/admin/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        # Внутренний API бота наружу не проксируется: он закрыт общим
        # секретом, но лишняя точка входа с улицы не нужна.
        location /api/internal/ {
            return 404;
        }

        # Backend API
        location /api/ {
            # Имя в переменной — иначе nginx резолвит его только на старте
            set $backend_upstream backend;
            proxy_pass http://$backend_upstream:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Uploads
        location /uploads/ {
            alias /usr/share/nginx/html/uploads/;
            autoindex off;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # WebSocket
        location /ws {
            set $ws_upstream backend;
            proxy_pass http://$ws_upstream:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
