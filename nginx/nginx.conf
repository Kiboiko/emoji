# Процессы по числу ядер. Не указано было — тогда он один, и вся раздача
# статики, сжатие и проксирование шли в одном потоке.
worker_processes auto;

# Лимит открытых файлов процесса. В контейнере по умолчанию 1024, а соединений
# разрешено 2048: каждое соединение клиента, каждое соединение к бэкенду и
# каждый открытый файл кеша или статики — отдельный дескриптор. Примерно на
# 500 одновременных соединениях дескрипторы кончались, и nginx отвечал 500
# («No file descriptors available») даже на главную страницу и на ответы из
# кеша. При нескольких десятках пользователей это не видно, при росте —
# первое, что сломалось бы.
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # Security headers
    # Allow Telegram Web to load the app in iframe (required for Mini Apps)
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    # Фото до 20 МБ (MAX_UPLOAD_SIZE в backend/config.py) плюс запас на
    # остальные поля формы
    client_max_body_size 25M;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;
    
    # DNS Docker. Без него nginx резолвит имена апстримов ОДИН раз при старте
    # и держит IP вечно: после `docker compose up -d --force-recreate backend`
    # контейнер получает новый IP, а nginx продолжает стучаться в старый и
    # отдаёт 502, пока его не перезапустят вручную.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Какую копию фото отдать (см. location /uploads/): ?size=thumb — маленькую
    # для каталога и списков, без параметра — облегчённую для страницы товара
    map $arg_size $upload_variant {
        thumb   _thumb;
        cart    _cart;
        default _web;
    }

    # Микрокеш публичных ответов API: каталог, карточка товара, категории,
    # магазины, условия, публичные настройки. Эти ответы одинаковы для всех
    # (в обработчиках нет пользователя), а запрашиваются при каждом открытии
    # приложения и при каждой прокрутке каталога. На три секунды их держит
    # nginx, и бэкенд с базой отвечают один раз за три секунды на адрес, а не
    # на каждого человека: пропускная способность каталога вырастает на
    # порядок, а запас на рост числа пользователей появляется без изменений в
    # коде. Цена — свежесть: новый товар или проданная вещь видны покупателю
    # с задержкой до трёх секунд (корзина и заказ проверяют остаток заново).
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_public:10m
                     max_size=64m inactive=10m use_temp_path=off;

    # Админка читает данные, которые только что правила: ей кеш не нужен
    map $http_referer $skip_api_cache {
        default       0;
        "~*/admin/"   1;
    }

    server {
        listen 80;
        server_name localhost;

        # Сама страница — без кеша (no-cache: каждый раз сверяется по ETag,
        # обычно это короткий ответ 304). В ней ссылки на файлы сборки, и без
        # заголовка Telegram мог держать прошлую страницу — после выката
        # человек видел старую версию приложения.
        #
        # add_header здесь отменяет наследование заголовков из блока http,
        # поэтому они повторены: без frame-ancestors Telegram Web не откроет
        # приложение во фрейме
        location = /index.html {
            root /usr/share/nginx/html/frontend;
            add_header Cache-Control "no-cache" always;
            add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Frontend
        location / {
            root /usr/share/nginx/html/frontend;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Файлы сборки Vite: в имени хеш содержимого (index-3lxEBtxb.js),
            # новая сборка — новые имена. Поэтому их можно держать в кеше
            # телефона хоть год: устаревшую версию он не покажет, её страница
            # (index.html, без кеша) ссылается на другие имена. Раньше здесь
            # действовало правило ниже, no-store, и телефон заново качал
            # полмегабайта кода при каждом открытии приложения.
            # Отсутствующий файл — 404, а не index.html: иначе HTML лёг бы в
            # кеш под именем скрипта на тот же год.
            location ^~ /assets/ {
                try_files $uri =404;
                expires 1y;
                add_header Cache-Control "public, immutable";
            }

            # Прочие JS/CSS без хеша в имени — без кеша
            location ~* \.(js|css)$ {
                add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
                add_header Pragma "no-cache";
                add_header Expires "0";
            }
            
            # Cache images/fonts only
            location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Admin Panel
        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            alias /usr/share/nginx/html/admin/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        # Страница админки — тоже без кеша, по той же причине
        location = /admin/index.html {
            alias /usr/share/nginx/html/admin/index.html;
            add_header Cache-Control "no-cache" always;
            add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Внутренний API бота наружу не проксируется: он закрыт общим
        # секретом, но лишняя точка входа с улицы не нужна.
        location /api/internal/ {
            return 404;
        }

        # Публичные GET-ответы — с кешем на три секунды (см. proxy_cache_path
        # выше). Список адресов закрытый и точный: только то, что одинаково
        # для всех. Всё, что связано с пользователем, админкой, корзиной и
        # заказами, сюда не попадает (/api/products/admin, /api/categories/all,
        # /api/cart и т.д.), а POST/PUT/DELETE nginx не кеширует вообще.
        # Заголовок Authorization в ключ не входит и кеш не отключает:
        # приложение шлёт его на каждый запрос, а ответ от него не зависит.
        # Регулярное выражение — в кавычках: без них nginx принимает «{36}»
        # за начало блока конфигурации и не стартует
        location ~ "^/api/(products(/[0-9a-fA-F-]{36})?|categories|stores(/(seller|channel)/[0-9a-fA-F-]{36})?|settings/public|terms)$" {
            set $backend_upstream backend;
            proxy_pass http://$backend_upstream:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering on;

            proxy_cache api_public;
            proxy_cache_key "$request_method $request_uri";
            proxy_cache_valid 200 3s;
            proxy_cache_bypass $skip_api_cache;
            proxy_no_cache $skip_api_cache;
            # Тысяча одновременных запросов на один адрес — один запрос в
            # бэкенд, остальные ждут его ответа
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            # Бэкенд перезапускается или недоступен — отдаётся последний
            # ответ, а не ошибка: витрина переживает короткий сбой
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;

            # add_header в location отменяет заголовки из блока http
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Backend API
        location /api/ {
            # Имя в переменной — иначе nginx резолвит его только на старте
            set $backend_upstream backend;
            proxy_pass http://$backend_upstream:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Фото. Продавцы грузят картинки как есть, и PNG 2000×2000 весит
        # 2–4 МБ: каталог из десятка таких тормозил на телефоне. Бэкенд
        # кладёт рядом облегчённые копии (backend/services/image_variants.py),
        # путь копии повторяет адрес оригинала:
        #   _web/uploads/listings/<имя>.png.jpg    до 1280 px;
        #   _thumb/uploads/listings/<имя>.png.jpg  до 600 px, для ?size=thumb.
        # Адрес в базе — адрес оригинала, а отдаётся по нему копия, если она
        # есть, и сам оригинал, если её нет. Тип ответа nginx берёт по
        # расширению найденного файла, так что JPEG уходит как JPEG.
        # ^~ — чтобы правило картинок из location / не перехватило запрос.
        location ^~ /uploads/ {
            root /usr/share/nginx/html;
            try_files /uploads/$upload_variant$uri.v3.webp
                      /uploads/$upload_variant$uri.v2.webp
                      /uploads/$upload_variant$uri.jpg
                      /uploads/$upload_variant$uri.webp
                      /uploads/_web$uri.v2.webp
                      /uploads/_web$uri.jpg
                      /uploads/_web$uri.webp
                      $uri
                      =404;
            autoindex off;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # WebSocket
        location /ws {
            set $ws_upstream backend;
            proxy_pass http://$ws_upstream:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
