# Локальная разработка. Docker Compose подхватывает этот файл автоматически,
# на боевом сервере его быть не должно (или запускать с `-f docker-compose.yml`).
#
# Что даёт:
#   * код backend монтируется внутрь контейнера — правки видны без пересборки,
#     а файлы, созданные внутри (например новые миграции от `alembic revision`),
#     остаются на хосте, а не пропадают вместе с одноразовым контейнером;
#   * --reload перезапускает uvicorn при изменении файлов;
#   * порт backend проброшен наружу для отладки в обход nginx.

services:
  backend:
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
