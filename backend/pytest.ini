[pytest]
testpaths = tests
asyncio_mode = auto
# И фикстуры, и тесты должны жить в ОДНОМ event loop: движок БД создаётся
# один раз на сессию, и при разных циклах asyncpg падает с
# "attached to a different loop".
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning
