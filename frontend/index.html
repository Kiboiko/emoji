<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#6366f1" />
    <title>Marketplace 2.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Тема ставится до первой отрисовки. React монтируется не мгновенно, и
      // без этого приложение успевало мигнуть светлым у тех, у кого тёмная.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var tg = window.Telegram && window.Telegram.WebApp;
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (tg && tg.colorScheme) || 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          // Приватный режим: обойдёмся светлой, React поправит
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
